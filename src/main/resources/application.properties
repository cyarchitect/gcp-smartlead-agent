# Spring Application Config
spring.application.name=smartlead-agent
server.port=8080

# Pluggable AI Provider Configuration
# Supported modes: mock, google-ai, vertex-ai
# Defaults to mock to enable out-of-the-box local runs without GCP credentials or billing accounts.
ai.provider=${AI_PROVIDER:mock}

# Google Cloud Platform Configuration (for Firestore)
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:your-gcp-project-id}

# Enable Firestore
spring.cloud.gcp.firestore.enabled=true

# Keep application running for SSE / Web server
spring.main.web-application-type=servlet

# --- Google AI Developer API Configuration (For ai.provider=google-ai) ---
# Obtain an API key from Google AI Studio (https://aistudio.google.com/)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.name=${GEMINI_MODEL_NAME:gemini-1.5-flash}

# --- Vertex AI Gemini Configuration (For ai.provider=vertex-ai) ---
# Relies on GCP ADC (Application Default Credentials)
gemini.location=us-central1
# gemini.model.name for vertex-ai defaults to gemini-3.5-flash
