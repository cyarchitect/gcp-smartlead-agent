# Spring Application Config
spring.application.name=smartlead-agent
server.port=8080

# Google Cloud Platform Configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:your-gcp-project-id}

# Enable Firestore
spring.cloud.gcp.firestore.enabled=true

# Keep application running for SSE / Web server
spring.main.web-application-type=servlet

# Gemini API Key (from environment variable)
gemini.api.key=${GEMINI_API_KEY}

# Vertex AI Gemini Configuration
gemini.location=us-central1
gemini.model.name=gemini-3.5-flash
